name: "podcast generator"
author: "joshini"
description: "Generated a feed of podcast"
runs:
  using: "docker"
  image: "dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: The commiters email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: The commiters name
    required: true
    default: ${{ github.actor }}